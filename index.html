<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Secret Share — Anonymous Voice Sanctuary</title>
    <meta name="description" content="Anonymous voice-based emotional sanctuary where strangers connect over encrypted calls to share secrets without knowing each other's identity." />
    <meta property="og:title" content="Secret Share — Anonymous Voice Sanctuary" />
    <meta property="og:description" content="Anonymous voice-based emotional sanctuary where strangers connect over encrypted calls to share secrets without knowing each other's identity." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // In AI Studio preview sandbox, HMR WebSocket is disabled. Ignore Vite websocket connection events.
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          const str = args.map(a => String(a?.message || a)).join(' ');
          if (str.includes('failed to connect to websocket') || str.includes('WebSocket closed')) {
            return;
          }
          origError.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(e) {
          const reasonStr = String(e?.reason?.message || e?.reason || '');
          if (reasonStr.includes('WebSocket') || reasonStr.includes('websocket')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(e) {
          const msgStr = String(e?.message || '');
          if (msgStr.includes('WebSocket') || msgStr.includes('websocket')) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500/20 selection:text-amber-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
